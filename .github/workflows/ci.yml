name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Least-privilege default for every job. Only the coverage job overrides this
# (contents: write) to publish its badge to the `badges` branch.
permissions:
  contents: read

env:
  # Opt JavaScript actions into Node 24 ahead of GitHub's deprecation of Node 20,
  # so any breakage surfaces on our schedule rather than at the forced flip.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        # -mod=readonly: fail if go.mod/go.sum would need edits (module-hash
        # verification) rather than silently rewriting the committed lockfiles.
        run: go vet -mod=readonly ./...

      - name: Test
        # -race: the campaign engine is concurrency-heavy.
        # -count=2: surfaces parallel-subtest races that only flake in CI.
        run: go test -mod=readonly -race -count=2 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint (gosec + staticcheck)
        # Prebuilt binary via the official action (SHA-pinned, cached) — immune to
        # setup-go's GOTOOLCHAIN=local pin, same reason e2e installs its tools
        # prebuilt. Version kept in lockstep with the Makefile `lint` target.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  coverage:
    runs-on: ubuntu-latest
    # contents: write lets the push-to-main run publish the badge SVG to the
    # `badges` branch. On PRs (incl. forks) the token is read-only; the publish
    # step is push-only, so it just runs the 80% gate there.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure coverage and enforce the 80% floor
        id: cov
        run: |
          go test -mod=readonly ./... -coverprofile=cover.out
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "total coverage: ${pct}%"
          # Fail the build if coverage drops below the floor, so the badge below
          # can never overstate a number the pipeline let through.
          awk -v p="$pct" 'BEGIN { if (p+0 < 80) { print "::error::coverage " p "% is below the 80% floor"; exit 1 } }'
      - name: Publish coverage badge
        # Push-to-main only, and best-effort: a hiccup here must never turn the
        # (already-passed) coverage gate red. Publishes a self-hosted SVG to the
        # `badges` branch — no external service, only the built-in token.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the coverage number through the environment rather than
          # interpolating ${{ }} straight into the script body (template-injection).
          PCT: ${{ steps.cov.outputs.pct }}
        run: |
          pct="$PCT"
          color=red
          awk "BEGIN{exit !($pct>=60)}" && color=yellow
          awk "BEGIN{exit !($pct>=70)}" && color=yellowgreen
          awk "BEGIN{exit !($pct>=80)}" && color=green
          awk "BEGIN{exit !($pct>=90)}" && color=brightgreen
          curl -sfL "https://img.shields.io/badge/coverage-${pct}%25-${color}" -o coverage.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$(mktemp -d)"
          if git clone --depth=1 --branch badges "$repo" "$dir" 2>/dev/null; then
            :
          else
            git clone --depth=1 "$repo" "$dir"
            git -C "$dir" checkout --orphan badges
            git -C "$dir" rm -rf . >/dev/null 2>&1 || true
          fi
          cp coverage.svg "$dir/coverage.svg"
          git -C "$dir" add coverage.svg
          if git -C "$dir" diff --cached --quiet; then
            echo "badge unchanged (${pct}%)"
          else
            git -C "$dir" commit -m "coverage: ${pct}%"
            git -C "$dir" push origin badges
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --source=. --config .gitleaks.toml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    # Full-pipeline test: select -> mirror -> apply (opens + tears down a real PR
    # on the sandbox repo). Needs the GOLD_FINGER_PAT secret; skips cleanly (green)
    # until it is set, and on fork PRs where secrets are unavailable.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard on secret
        id: guard
        env:
          PAT: ${{ secrets.GOLD_FINGER_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOLD_FINGER_PAT secret not set — skipping e2e. Add it in Settings > Secrets and variables > Actions to enable."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Go
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ghorg and multi-gitter
        # Install the two runtime CLIs the way real users do — Homebrew bottles,
        # the same `depends_on` goldfinger's formula declares — not `go install`.
        # Prebuilt (faster) and immune to setup-go's GOTOOLCHAIN=local pin, which
        # made `go install ghorg` fail when ghorg needed a newer Go than go.mod
        # (the reason go.mod was bumped to 1.26.5). Uses current core versions
        # rather than a pin, so e2e also catches breakage from new tool releases.
        # Homebrew is preinstalled on ubuntu runners but off PATH; load its
        # shellenv, then persist its bin dir so the later "Run e2e" step sees
        # both tools on PATH.
        if: steps.guard.outputs.run == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install ghorg multi-gitter
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Configure git identity
        # multi-gitter authors the commit from git config; CI has none by default.
        if: steps.guard.outputs.run == 'true'
        run: |
          git config --global user.name "goldfinger-e2e[bot]"
          git config --global user.email "goldfinger-e2e@users.noreply.github.com"
      - name: Run e2e
        if: steps.guard.outputs.run == 'true'
        env:
          GOLD_FINGER_PAT: ${{ secrets.GOLD_FINGER_PAT }}
          GH_TOKEN: ${{ secrets.GOLD_FINGER_PAT }} # for the gh CLI (verify + teardown)
        run: make e2e

  build-binary:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binary
        # Pure Go (CGO_ENABLED=0) cross-compiles to darwin from the linux runner.
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -mod=readonly -trimpath -o dist/goldfinger-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldfinger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/goldfinger-${{ matrix.goos }}-${{ matrix.goarch }}
