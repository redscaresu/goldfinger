name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        # -race: the campaign engine is concurrency-heavy.
        # -count=2: surfaces parallel-subtest races that only flake in CI.
        run: go test -race -count=2 ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --source=. --config .gitleaks.toml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    # Full-pipeline test: select -> mirror -> apply (opens + tears down a real PR
    # on the sandbox repo). Needs the GOLD_FINGER_PAT secret; skips cleanly (green)
    # until it is set, and on fork PRs where secrets are unavailable.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard on secret
        id: guard
        env:
          PAT: ${{ secrets.GOLD_FINGER_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOLD_FINGER_PAT secret not set — skipping e2e. Add it in Settings > Secrets and variables > Actions to enable."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Go
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ghorg and multi-gitter
        if: steps.guard.outputs.run == 'true'
        run: |
          go install github.com/gabrie30/ghorg@v1.11.14
          go install github.com/lindell/multi-gitter@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Configure git identity
        # multi-gitter authors the commit from git config; CI has none by default.
        if: steps.guard.outputs.run == 'true'
        run: |
          git config --global user.name "goldfinger-e2e[bot]"
          git config --global user.email "goldfinger-e2e@users.noreply.github.com"
      - name: Run e2e
        if: steps.guard.outputs.run == 'true'
        env:
          GOLD_FINGER_PAT: ${{ secrets.GOLD_FINGER_PAT }}
          GH_TOKEN: ${{ secrets.GOLD_FINGER_PAT }} # for the gh CLI (verify + teardown)
        run: make e2e

  build-binary:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -o dist/goldfinger-linux-${{ matrix.arch }} ./cmd
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldfinger-linux-${{ matrix.arch }}
          path: dist/goldfinger-linux-${{ matrix.arch }}
