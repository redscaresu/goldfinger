name: Security

# The shared security gates from redscaresu/github-actions: zizmor, gitleaks,
# govulncheck, CodeQL and dependency review, as `security / <job>` checks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  security:
    name: security
    permissions:
      contents: read
      security-events: write # codeql uploads its results
    uses: redscaresu/github-actions/.github/workflows/security.yml@a10d7b3d071d40fb18d4b41d5df95697678e7645 # v1.0.1
