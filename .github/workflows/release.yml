name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default: read-only token for every job, with write granted
# per-job only where a job actually mutates the release. Keeps the tap-push and
# smoke jobs from ever holding a write-capable GITHUB_TOKEN.
permissions:
  contents: read

# Serialise runs for a given tag. The create-release guard is race-free within a
# single run, but a re-run overlapping the original (same tag) could otherwise
# have two runs each miss the release and both create/upload. Queue them instead
# of cancelling — a release mid-publish must never be interrupted.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt JavaScript actions into Node 24 ahead of GitHub's deprecation of Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Create the release ONCE, before the build matrix fans out. This is the fix
  # for a cold-start race: four matrix legs used to each "create-or-update" the
  # release, but on a brand-new tag the release doesn't exist and the tag isn't
  # yet API-discoverable, so multiple legs each CREATED a release — yielding
  # duplicate release objects and an `already_exists` error on finalise.
  # Serialising creation here means every downstream leg finds one shared
  # release and only uploads to it. Created as a draft with auto-generated notes
  # (the "What's Changed" changelog from the PRs merged since the last tag); the
  # `publish` job flips it live only once all assets are attached, so a
  # half-populated release is never visible as "Latest".
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release for this tag
    steps:
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it in place."
            exit 0
          fi
          # --verify-tag: fail loudly if the ref isn't a real tag rather than
          # letting gh auto-create one from the default branch.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --generate-notes

  build-and-release:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads the built binaries as release assets
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module cache in this publishing workflow: a cache entry poisoned on
          # a PR run could be restored here and baked into a released binary.
          cache: false

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BINARY_NAME="goldfinger-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${BINARY_NAME}" ./cmd
          (cd dist && sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256")

      - name: Upload binary to release
        # Each leg uploads its own two distinct filenames to the release the
        # create-release job already made, so there is no create path to race on
        # and no cross-leg filename collision. --clobber makes a re-run idempotent.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/goldfinger-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "dist/goldfinger-${{ matrix.goos }}-${{ matrix.goarch }}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # Combine the per-binary checksums into one SHA256SUMS manifest. Each matrix
  # leg builds in isolation, so it can only see its own binary — this job waits
  # for all four, pulls their .sha256 assets back off the release, concatenates
  # them, and attaches the manifest the README's `shasum -a 256 -c SHA256SUMS`
  # verify step expects.
  checksums:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # downloads the per-binary checksums and uploads SHA256SUMS
    steps:
      - name: Build SHA256SUMS from the per-binary checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.sha256' --dir dist
          # Each .sha256 already holds "<hash>  <binary>"; concatenating them (sorted
          # by filename for a stable manifest) yields a standard SHA256SUMS file.
          (cd dist && cat *.sha256 | sort -k2 > SHA256SUMS)

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # Flip the draft release live only after every binary and the SHA256SUMS
  # manifest are attached, so consumers (and Homebrew) never see a partial
  # release marked "Latest".
  publish:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the release
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false --latest

  # Bump the Homebrew tap so `brew install redscaresu/tap/goldfinger` tracks this
  # release. Self-gating: with no HOMEBREW_TAP_TOKEN secret set the step logs a
  # notice and exits 0, so the release never fails on a missing tap. To enable,
  # create the redscaresu/homebrew-tap repo and add a HOMEBREW_TAP_TOKEN secret
  # (a token with contents:write on that repo).
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads release assets; the tap push uses TAP_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew formula bump."
            exit 0
          fi
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --pattern '*.sha256' --dir dist
          sh packaging/homebrew/bump.sh "${GITHUB_REF_NAME}" dist > goldfinger.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/redscaresu/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp goldfinger.rb tap/Formula/goldfinger.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/goldfinger.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "goldfinger ${GITHUB_REF_NAME}"
          git push

  # Smoke-test the published formula the way a user would: tap the real repo and
  # `brew install redscaresu/tap/goldfinger`. Proves the release asset URL/sha256
  # are correct for macOS, that `depends_on` pulls ghorg + multi-gitter, and that
  # the installed binary reports this tag's version. Runs on macOS (the primary
  # audience). Self-gating like the publish job: with no HOMEBREW_TAP_TOKEN there
  # is nothing in the tap to test, so it skips cleanly.
  homebrew-smoke:
    needs: homebrew
    runs-on: macos-latest
    permissions:
      contents: read # installs the published formula from a public tap
    steps:
      - name: Guard on tap token
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — no formula published, skipping smoke test."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install from the tap and verify
        if: steps.guard.outputs.run == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install redscaresu/tap/goldfinger
          got="$(goldfinger --version)"
          echo "installed: ${got}"
          case "${got}" in
            *"${GITHUB_REF_NAME}"*) echo "version matches ${GITHUB_REF_NAME}" ;;
            *) echo "::error::version mismatch: got '${got}', expected ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          # Prove the depends_on chain resolved onto PATH.
          command -v ghorg >/dev/null       || { echo "::error::ghorg not installed by depends_on"; exit 1; }
          command -v multi-gitter >/dev/null || { echo "::error::multi-gitter not installed by depends_on"; exit 1; }
          echo "ghorg + multi-gitter present via depends_on"
