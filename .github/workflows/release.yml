name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Opt JavaScript actions into Node 24 ahead of GitHub's deprecation of Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BINARY_NAME="goldfinger-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${BINARY_NAME}" ./cmd
          (cd dist && sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256")

      - name: Upload binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/goldfinger-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/goldfinger-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  # Combine the per-binary checksums into one SHA256SUMS manifest. Each matrix
  # leg builds in isolation, so it can only see its own binary — this job waits
  # for all four, pulls their .sha256 assets back off the release, concatenates
  # them, and attaches the manifest README's `shasum -a 256 -c SHA256SUMS`
  # verify step expects.
  checksums:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Build SHA256SUMS from the per-binary checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.sha256' --dir dist
          # Each .sha256 already holds "<hash>  <binary>"; concatenating them (sorted
          # by filename for a stable manifest) yields a standard SHA256SUMS file.
          (cd dist && cat *.sha256 | sort -k2 > SHA256SUMS)

      - name: Upload SHA256SUMS to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS

  # Bump the Homebrew tap so `brew install redscaresu/tap/goldfinger` tracks this
  # release. Self-gating: with no HOMEBREW_TAP_TOKEN secret set the step logs a
  # notice and exits 0, so the release never fails on a missing tap. To enable,
  # create the redscaresu/homebrew-tap repo and add a HOMEBREW_TAP_TOKEN secret
  # (a token with contents:write on that repo).
  homebrew:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew formula bump."
            exit 0
          fi
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --pattern '*.sha256' --dir dist
          sh packaging/homebrew/bump.sh "${GITHUB_REF_NAME}" dist > goldfinger.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/redscaresu/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp goldfinger.rb tap/Formula/goldfinger.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/goldfinger.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "goldfinger ${GITHUB_REF_NAME}"
          git push
