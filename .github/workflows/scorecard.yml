name: Scorecard

# OpenSSF Scorecard: a third-party, automated audit of this repo's supply-chain
# posture (pinned actions, branch protection, signed releases, SAST, token
# permissions, ...). It's the external-attestation complement to the in-tree
# gates — an adopter who won't read the source can trust the published score and
# the Security tab instead. Runs on the default branch only: Scorecard grades the
# repo as a whole, so a PR branch can't meaningfully score itself.
on:
  branch_protection_rule: # re-score when branch protection changes
  schedule:
    - cron: '32 5 * * 1' # weekly, Monday — catch drift even without a push
  push:
    branches: [main]

# Least-privilege default; the analysis job widens only the two scopes it needs.
permissions: read-all

# NOTE: no workflow-level `env`/`defaults` here on purpose. OpenSSF Scorecard's
# publishing path refuses to publish from a workflow that sets either (part of
# its tamper-resistance checks), and scorecard-action logs that refusal as a
# *warning* — the SARIF/code-scanning upload would stay green while the badge
# silently never updates. The pinned actions below are all Node-era releases, so
# the FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opt-in used elsewhere isn't needed.

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to the Security tab
      id-token: write # publish the result to OpenSSF so the README badge can read it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF API so the badge in README.md resolves. This
          # only publishes the score, never repo contents, and only runs on the
          # public default branch.
          publish_results: true

      # Keep the raw SARIF as an artifact so a run's findings are inspectable even
      # if the code-scanning upload is unavailable (e.g. private-repo limits).
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
